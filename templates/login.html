
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background:
                radial-gradient(circle at 15% 20%, #ded7ff, transparent 35%),
                radial-gradient(circle at 90% 85%, #d9d2ff, transparent 35%),
                #f7f6ff;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 42px;
            background: white;
            border: 1px solid #eeeaff;
            border-radius: 23px;
            box-shadow: 0 18px 50px rgba(60, 40, 130, 0.12);
        }

        /* Logo */

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #202944;
            font-size: 31px;
            font-weight: 800;
        }

        .brand-icon {
            width: 47px;
            height: 50px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #8060f5, #4823c9);
            color: white;
            font-size: 28px;
            clip-path: polygon(
                50% 0, 100% 20%, 90% 75%,
                50% 100%, 10% 75%, 0 20%
            );
        }

        .logo p {
            color: #9290a5;
            font-size: 10px;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* Heading */

        h2 {
            text-align: center;
            color: #202944;
            font-size: 27px;
            margin-bottom: 9px;
        }

        .subtitle {
            text-align: center;
            color: #858ba0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Form */

        label {
            display: block;
            margin-bottom: 9px;
            color: #303a57;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 21px;
            border: 1px solid #ded9f2;
            border-radius: 10px;
            background: #faf9ff;
            color: #26314e;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #7650ed;
            background: white;
            box-shadow: 0 0 0 3px rgba(118, 80, 237, 0.1);
        }

        input::placeholder {
            color: #a3a4b4;
        }

        /* Button */

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7650ed, #4c27c9);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 7px 18px rgba(89, 53, 211, 0.18);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(89, 53, 211, 0.25);
        }

        /* Error message */

        .message {
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
            color: #b42318;
            background: #fff0ef;
            border: 1px solid #ffd2ce;
            border-radius: 9px;
            font-size: 13px;
        }

        /* Footer */

        .footer {
            text-align: center;
            margin-top: 27px;
            line-height: 2.2;
            color: #858ba0;
            font-size: 13px;
        }

        .footer a {
            color: #6340d5;
            text-decoration: none;
            font-weight: 800;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 17px;
            padding: 12px;
            text-align: center;
            background: #f2efff;
            border-radius: 9px;
            color: #65578e;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }

            .brand {
                font-size: 26px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">

            <div class="brand">
                <div class="brand-icon">✓</div>
                <span>TrustVault</span>
            </div>

            <p>YOUR DOCUMENTS. YOUR SECURITY.</p>

        </div>

        <!-- Heading -->
        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to access your secure documents.
        </p>

        <!-- Error message -->
        {% if error %}
            <div class="message">
                {{ error }}
            </div>
        {% endif %}

        <!-- Login form -->
        <form action="{{ url_for('login') }}" method="POST">

            <!-- CSRF Protection Token -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Sign In →
            </button>

        </form>

        <!-- Footer -->
        <div class="footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

            <div class="security-note">
                🔒 Your information is protected.
            </div>

            <p>
                <a href="{{ url_for('home') }}">
                    ← Back to Home
                </a>
            </p>

        </div>

    </div>

</body>
</html>
